[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "universe-pdf"
version = "1.0.0"
description = "Русскоязычный Telegram-бот для сборки разных файлов в один PDF"
requires-python = ">=3.12"
dependencies = [
  "python-telegram-bot[job-queue]>=22.6,<23",
  "Pillow>=12,<13",
  "pillow-heif>=1.1,<2",
  "pypdf>=6,<7",
  "reportlab>=4.4,<5",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "pymupdf>=1.26,<2",
       "openpyxl>=3.1,<4", "python-pptx>=1,<2"]

[project.scripts]
universe-pdf = "universe_pdf.bot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["office: проверка настоящего LibreOffice"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
