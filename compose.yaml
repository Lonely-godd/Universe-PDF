services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=3g,mode=1777
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 210s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
